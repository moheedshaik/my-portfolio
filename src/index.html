<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shaik Moheed — Software Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shaik Moheed — Software Engineer building scalable, reliable web applications with Angular, Java and Node.js.">
  <meta name="author" content="Shaik Moheed">
  <!-- Matches the default below, and ThemeService rewrites it on toggle so
       the browser's own chrome keeps up. Not split by prefers-color-scheme
       any more: the site no longer follows the OS. -->
  <meta name="theme-color" content="#0a0a0c">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Stamps the theme before first paint. This must be inline and in <head>:
       deferred to the Angular bundle it would run after the browser has already
       painted, so every load would start with a white flash before going dark.

       Dark is the default a first-time visitor lands on, regardless of what
       their OS prefers — the site is designed dark-first and the switch is
       right there in the header. Only an explicit choice to go light is
       honoured, and it is remembered from then on.

       Always sets the attribute, so styles.css needs one dark palette rather
       than a copy under [data-theme] and another under a media query. -->
  <script>
    (function () {
      var light = false;
      try {
        light = localStorage.getItem('theme') === 'light';
      } catch (e) {
        /* Private mode can throw on localStorage; fall through to the default. */
      }
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    })();
  </script>

  <!-- Social cards: without these, shared links render as a blank grey box. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shaik Moheed — Software Engineer">
  <meta property="og:description" content="Software Engineer building scalable, reliable web applications with Angular, Java and Node.js.">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shaik Moheed — Software Engineer">
  <meta name="twitter:description" content="Software Engineer building scalable, reliable web applications with Angular, Java and Node.js.">
  <meta name="twitter:image" content="og-image.png">
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

  <!-- Used only by the Atlas demo, which styles itself as a separate product.
       Declaring them here costs other pages one cached stylesheet; the font
       files themselves download only where something actually uses them. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
