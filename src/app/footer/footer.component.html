<footer class="footer">
  <div class="footer-container">
    <div class="footer-left">
      © {{ year }} Designed and Built by <span>Shaik Moheed</span>
    </div>

    <div class="footer-right">
      @for (s of socials; track s.label) {

        </a>
      }
    </div>
  </div>
</footer>
