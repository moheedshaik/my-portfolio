<header class="navbar">
  <div class="logo">SM.</div>

  <nav class="nav-links">
    <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="fa-solid fa-house"></i> Home
    </a>
    <a class="nav-item" routerLink="/about" routerLinkActive="active">
      <i class="fa-regular fa-user"></i> About
    </a>
    <a class="nav-item" routerLink="/projects" routerLinkActive="active">
      <i class="fa-solid fa-code"></i> Projects
    </a>
    <a class="nav-item" routerLink="/resume" routerLinkActive="active">
      <i class="fa-regular fa-file-lines"></i> Resume
    </a>
    <a class="nav-item" routerLink="/contact" routerLinkActive="active">
      <i class="fa-regular fa-envelope"></i> Contact
    </a>
  </nav>

  <i class="fa-solid fa-bars menu-icon" (click)="menuOpen = true"></i>
</header>

<!-- MOBILE NAV MENU -->
<div class="mobile-menu" [class.open]="menuOpen">
  <div class="mobile-header">
    <div class="logo">SM.</div>
    <i class="fa-solid fa-xmark close" (click)="menuOpen = false"></i>
  </div>

  <nav class="mobile-nav">
    <a routerLink="/" (click)="menuOpen = false"><i class="fa-solid fa-house"></i> Home</a>
    <a routerLink="/about" (click)="menuOpen = false"><i class="fa-regular fa-user"></i> About</a>
    <a routerLink="/projects" (click)="menuOpen = false"><i class="fa-solid fa-code"></i> Projects</a>
    <a routerLink="/resume" (click)="menuOpen = false"><i class="fa-regular fa-file-lines"></i> Resume</a>
    <a routerLink="/contact" (click)="menuOpen = false"><i class="fa-regular fa-envelope"></i> Contact</a>
  </nav>
</div>
