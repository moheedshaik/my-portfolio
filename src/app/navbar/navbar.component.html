<header class="navbar">
  <a class="logo" routerLink="/">SM<b aria-hidden="true">&#9651;</b></a>

  <nav class="nav-links">
    <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a class="nav-item" routerLink="/about" routerLinkActive="active">About</a>
    <a class="nav-item" routerLink="/projects" routerLinkActive="active">Projects</a>
    <a class="nav-item" routerLink="/resume" routerLinkActive="active">Resume</a>
    <a class="nav-item" routerLink="/contact" routerLinkActive="active">Contact</a>
  </nav>

  <button type="button" class="menu-icon" aria-label="Open menu" (click)="menuOpen = true">
    <i class="fa-solid fa-bars"></i>
  </button>
</header>

<!-- MOBILE NAV MENU -->
<div class="mobile-menu" [class.open]="menuOpen">
  <div class="mobile-header">
    <a class="logo" routerLink="/" (click)="menuOpen = false">SM<b aria-hidden="true">&#9651;</b></a>
    <button type="button" class="close" aria-label="Close menu" (click)="menuOpen = false">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <nav class="mobile-nav">
    <a routerLink="/" (click)="menuOpen = false">Home</a>
    <a routerLink="/about" (click)="menuOpen = false">About</a>
    <a routerLink="/projects" (click)="menuOpen = false">Projects</a>
    <a routerLink="/resume" (click)="menuOpen = false">Resume</a>
    <a routerLink="/contact" (click)="menuOpen = false">Contact</a>
  </nav>
</div>
